<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="192" height="192" rx="38" fill="url(#bgGradient)"/>
  
  <!-- POS Icon Design - Cash Register/Terminal -->
  <!-- Screen/Display -->
  <rect x="56" y="45" width="80" height="45" rx="4" fill="white" opacity="0.95"/>
  <rect x="60" y="49" width="72" height="37" rx="2" fill="#1e3a8a" opacity="0.2"/>
  
  <!-- Base/Keyboard -->
  <rect x="46" y="97" width="100" height="48" rx="4" fill="url(#accentGradient)"/>
  
  <!-- Keys -->
  <g fill="white" opacity="0.9">
    <rect x="52" y="103" width="18" height="11" rx="2"/>
    <rect x="74" y="103" width="18" height="11" rx="2"/>
    <rect x="96" y="103" width="18" height="11" rx="2"/>
    <rect x="118" y="103" width="18" height="11" rx="2"/>
    
    <rect x="52" y="118" width="18" height="11" rx="2"/>
    <rect x="74" y="118" width="18" height="11" rx="2"/>
    <rect x="96" y="118" width="18" height="11" rx="2"/>
    <rect x="118" y="118" width="18" height="11" rx="2"/>
    
    <rect x="52" y="133" width="40" height="9" rx="2"/>
    <rect x="96" y="133" width="40" height="9" rx="2"/>
  </g>
  
  <!-- Currency Symbol -->
  <text x="96" y="73" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#dc2626" text-anchor="middle">Ksh</text>
  
  <!-- BMC_POS_SYS Text -->
  <text x="96" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" letter-spacing="1">BMC_POS</text>
  <text x="96" y="182" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5" opacity="0.95">SYSTEM</text>
  
  <!-- Decorative elements -->
  <circle cx="168" cy="24" r="8" fill="url(#accentGradient)" opacity="0.8"/>
  <circle cx="24" cy="168" r="6" fill="white" opacity="0.3"/>
  <circle cx="168" cy="168" r="10" fill="white" opacity="0.2"/>
</svg>
