name: Translation Audit

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  translations:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env || true

      - name: Verify Translation Baseline Exists
        run: test -f docs/translation/translation_baseline.json

      - name: Run Translation Audit (Fail on New Issues)
        run: |
          php artisan translations:audit \
            --base=en \
            --baseline=docs/translation/translation_baseline.json \
            --new-only \
            --fail-on-issues \
            --top-per-locale=200 \
            --export=storage/app/translation_audit_ci_new.json \
            --worklist-dir=storage/app/translation_worklists_ci

      - name: Upload Translation Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: translation-audit
          path: |
            storage/app/translation_audit_ci_new.json
            storage/app/translation_worklists_ci
